[project]
name = "llm-benchmark"
version = "0.1.0"
description = "Internal LLM API gateway baseline benchmark service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1"
]

[dependency-groups]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.0"]
evalscope = ["evalscope[perf,sandbox]>=1.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
